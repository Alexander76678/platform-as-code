---
- name: Configure database
  hosts: databases
  become: true
  roles:
    - database

- name: Configure load balancer
  hosts: loadbalancers
  become: true
  roles:
    - loadbalancer
- name: Configure app servers
  hosts: appservers
  become: true
  roles:
    - docker
    - app
