---
- name: Install MongoDB prerequisites
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add MongoDB 9.0 GPG key
  ansible.builtin.get_url:
    url: https://pgp.mongodb.com/server-9.asc
    dest: /usr/share/keyrings/mongodb-server-9.asc
    mode: "0644"

- name: Add MongoDB 9.0 repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [ arch=amd64,arm64
      signed-by=/usr/share/keyrings/mongodb-server-9.asc ]
      https://repo.mongodb.org/apt/ubuntu
      resolute/mongodb-org/9.0 multiverse
    filename: mongodb-org-9.0
    state: present

- name: Install MongoDB 9.0
  ansible.builtin.apt:
    name: mongodb-org
    state: present
    update_cache: true

- name: Bind MongoDB to all interfaces
  ansible.builtin.lineinfile:
    path: /etc/mongod.conf
    regexp: '^\s*bindIp:'
    line: '  bindIp: 0.0.0.0'
  notify: Restart mongod

- name: Apply config changes before the first start
  ansible.builtin.meta: flush_handlers

- name: Ensure MongoDB is running and enabled
  ansible.builtin.systemd:
    name: mongod
    state: started
    enabled: true

- name: Wait for MongoDB to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 27017
    timeout: 90

