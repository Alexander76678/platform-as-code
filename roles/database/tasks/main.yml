---
- name: Install MongoDB prerequisites
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: true

- name: Add MongoDB GPG key
  ansible.builtin.get_url:
    url: https://www.mongodb.org/static/pgp/server-7.0.asc
    dest: /usr/share/keyrings/mongodb-server-7.0.asc
    mode: "0644"

- name: Add MongoDB repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/mongodb-server-7.0.asc]
      https://repo.mongodb.org/apt/ubuntu
      jammy/mongodb-org/7.0 multiverse
    filename: mongodb-org-7.0
    state: present

- name: Install MongoDB
  ansible.builtin.apt:
    name: mongodb-org
    state: present
    update_cache: true

- name: Bind MongoDB to all interfaces
  ansible.builtin.lineinfile:
    path: /etc/mongod.conf
    regexp: '^\s*bindIp:'
    line: '  bindIp: 0.0.0.0'
  notify: Restart mongod

- name: Ensure mongod is running and enabled
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: true
