---
- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Render app environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/app.env"
    mode: "0600"
  notify: Restart app container

- name: Log in to GHCR
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ ghcr_user }}"
    password: "{{ ghcr_token }}"

- name: Pull app image
  community.docker.docker_image:
    name: "{{ app_image }}"
    source: pull
    force_source: true

- name: Run app container
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: "{{ app_image }}"
    state: started
    restart_policy: always
    recreate: true
    env_file: "{{ app_dir }}/app.env"
    ports:
      - "{{ app_port }}:8000"
